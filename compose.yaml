services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - product_uploads:/var/www/html/public/uploads/products
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-mvc_app}
      DB_USERNAME: ${POSTGRES_USER:-mvc_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mvc_password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mvc_app}
      POSTGRES_USER: ${POSTGRES_USER:-mvc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvc_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  product_uploads:
